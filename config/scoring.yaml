# Deterministic scoring model. No AI is used anywhere in scoring (CLAUDE.md AI rules).
# Score = min(100, round_half_up(weighted_sum x stacking_multiplier)).
model_version: "v0.5-handset"

# ---- Residential filter ------------------------------------------------------------
# Only parcels whose parcels.land_use is one of these codes are scored.
# Code MEANINGS ARE UNCONFIRMED (SOURCES.md #7, BACKLOG.md). They were chosen from the unit
# counts the assessor file reports for each code (see land_use_profile.csv, units_* columns).
# Not scored: 10 (0 units, likely vacant), 15 (median 21 units), 86/88 (unclear), and all
# commercial / industrial / institutional / other codes.
residential_land_use:
  "11": single-family residence        # median 1 unit
  "17": condominium                    # stacked single-unit footprints
  "12": duplex to fourplex             # median 2 units
  "13": triplex to fourplex            # median 3 units
  "14": small multifamily              # 3-15 units, median 8

# ---- Suppression ----------------------------------------------------------------------
suppression:
  recent_sale_months: 24   # a sale in sales_history within this many months -> no score
  # also: any row in suppressions that is active (until_date null or >= as-of date)

# ---- Stacking ---------------------------------------------------------------------------
# +15% for each independent signal family beyond the first, capped at +45% (v0.5: was +10% / +30%, which squeezed the best
# multi-signal leads into 47-63). Base weights below were raised at the same time; see DECISIONS.md D17.
stacking:
  bonus_per_extra_family: 0.15
  cap: 0.45
  families: [financial, rental, permits, upzoning, fire, owner]

# ---- Signals ----------------------------------------------------------------------------
# contribution = weight x 0.5 ** (age_days / half_life_days) x confidence; static signals
# (half_life_days: null) do not decay. confidence is the signal's match confidence (recorded in
# the component as confidence_multiplier). age_days = days between signal_date and the as-of date (never negative).
# One component per signal key: the strongest (most recent) live instance. A parcel with ten
# re-roof permits scores the permit component once.
# snapshot: true -> only the latest snapshot counts (parcel must have a row dated on the latest
# signal_date seen for that signal type), so repeated daily rows never stack.
signals:
  tax_default:          # signal_date = date of the notice/list the parcel appears on (decay runs from it)
    family: financial
    weight: 40
    half_life_days: 365
  stro_license_removed:
    family: rental
    weight: 40
    half_life_days: 90
  stro_license_active:
    family: rental
    weight: 5
    half_life_days: null    # static, context only
    snapshot: true
  permit_approved:
    family: permits
    by_group:
      pre_sale_prep:        {weight: 36, half_life_days: 120}   # v0.4: cosmetic/remodel scope only (D14)
      maintenance:          {weight: 0,  half_life_days: 180}   # v0.4: like-for-like systems work, no weight
      demolition_lot_split: {weight: 27, half_life_days: 180}
      adu:                  {weight: 18, half_life_days: 180}
      remodel_addition:     {weight: 14, half_life_days: 180}
      solar_energy:         {weight: 3,  half_life_days: 180}
      other:                {weight: 0,  half_life_days: 180}
  permit_stalled:
    family: permits
    weight: 27
    half_life_days: 365
    groups: [remodel_addition, adu, demolition_lot_split]   # derivation also enforces expired > 90 days
  sb79_transit_estimate:
    family: upzoning
    half_life_days: null
    snapshot: true
    by_detail: distance_band
    values:
      within_200ft: 21          # inside 1/4 mile
      within_quarter_mile: 21
      within_half_mile: 15
  sb9_lot_split_estimate:
    family: upzoning
    weight: 14
    half_life_days: null
    snapshot: true
  fire_hazard_zone:
    family: fire
    half_life_days: null
    snapshot: true
    by_detail: hazard_class
    # Values are matched after lower-casing and turning spaces/underscores into one space.
    values:
      very high: 15
      high: 9
      moderate: 4

# ---- Owner modifiers (owners table, latest as_of per parcel; static) ---------------------
# out_of_state and absentee are not additive: out_of_state (+15) when true, otherwise absentee (+13).
# Total owner-modifier contribution is capped (over the cap, every owner component is scaled
# by the same factor, recorded as cap_multiplier).
owner_modifiers:
  cap: 40
  years_owned:                  # from owners.last_sale_date; highest matching tier only
    - {min_years: 30, weight: 20}
    - {min_years: 20, weight: 13}
  absentee:         {weight: 13}
  out_of_state:     {weight: 15}
  mortgage_open_false: {weight: 13}
  est_equity_top_quartile: {weight: 6, percentile: 75}   # est_equity >= territory 75th percentile

# ---- Score bands --------------------------------------------------------------------------------
# Display bands (a score at or above `min` is in the band; first match from the top). The dashboard reads
# these through dashboard/src/data/catalog.generated.json (territory.export_catalog), never its own copy.
score_bands:
  - {key: hot,   label: Hot,   min: 80}
  - {key: warm,  label: Warm,  min: 60}
  - {key: watch, label: Watch, min: 40}
  - {key: low,   label: Low,   min: 0}

# ---- reason_text --------------------------------------------------------------------------
reason_text:
  max_components: 4

# ---- Recipes --------------------------------------------------------------------------------
# Explicit conditions over the parcel's effective signals and owner fields.
#   {signal: <type>, group: <g>, within_days: N, detail: {key: [values]}}  signal present
#   {owner: <field>, is: true|false}   {owner: years_owned, gte: N}
#   {all: [...]}  {any: [...]}  {not: <cond>}
# requires_data: [fire_zones] -> recipe is active only when that data is loaded.
recipes:
  str_exit:
    label: Short-term rental exit
    short_description: STR license removed in the last year
    description: Short-term rental license removed in the last year.
    rationale: "A short-term rental license for this property was removed in the last year, so the home may no longer earn that rental income and its future use is worth asking about."
    when:
      signal: stro_license_removed
      within_days: 365
  tired_landlord:
    label: Tired landlord
    short_description: Long-held absentee owner with a distress signal
    description: Long-held absentee owner with a distress or friction signal.
    rationale: "The owner does not live at the property, has held it 15 or more years, and there is a sign of friction on it (an expired permit or a removed rental license). Long-held rentals with friction are homes where a conversation about selling can be timely."
    when:
      all:
        - {owner: absentee, is: true}
        - {owner: years_owned, gte: 15}
        - any:
            - {signal: tax_default}
            - {signal: stro_license_removed, within_days: 730}
            - {signal: permit_stalled}
  builder_bait:
    label: Builder bait
    short_description: Estimated upzoning potential on a large lot
    description: Estimated upzoning potential on a large lot with a long-held owner.
    rationale: "The lot is much larger than most in its area and an estimated state-law screen says it may allow splitting the lot or building more homes. The owner has held it 20 or more years, so a builder or investor may see more in the land than a typical buyer would."
    when:
      all:
        - any:
            - {signal: sb9_lot_split_estimate}
            - {signal: sb79_transit_estimate}
        - {parcel: lot_vs_area_median, gte: 1.5}   # lot_sqft >= 1.5 x median residential lot_sqft of the planning area
        - {owner: years_owned, gte: 20}
  pre_list_prep:
    label: Pre-list prep
    short_description: Pre-sale permit on a long-held home
    description: Pre-sale type permit approved in the last 6 months on a long-held home.
    rationale: "A permit for cosmetic or remodel work (kitchen, bath, windows, roof, paint, landscaping) was approved in the last six months on a home the owner has held 10 or more years. This is the kind of work that often goes in before a sale."
    when:
      all:
        - {signal: permit_approved, group: pre_sale_prep, within_days: 180}
        - {owner: years_owned, gte: 10}
  stalled_project:
    label: Stalled project
    short_description: Permit expired with no close date
    description: Permit expired more than 90 days ago with no close date.
    rationale: "A building permit expired more than 90 days ago and was never closed, so the project may be unfinished."
    when:
      signal: permit_stalled
  downsizer:
    label: Downsizer
    short_description: Long-held owner-occupant with no mortgage
    description: Owner-occupied, long-held, no open mortgage.
    rationale: "The owner lives in the home, has held it 20 or more years and has no open mortgage. Owners with this profile may want a smaller or simpler home."
    when:
      all:
        - {owner: absentee, is: false}
        - {owner: years_owned, gte: 20}
        - {owner: mortgage_open, is: false}
  insurance_squeeze:
    label: Insurance squeeze
    short_description: High or very high fire hazard zone
    description: High or very high fire hazard zone.
    rationale: "The home is in a high or very high fire hazard zone, where insurance can cost more or be harder to get."
    requires_data: [fire_zones]
    when:
      signal: fire_hazard_zone
      detail: {hazard_class: [high, very high]}
  financial_pressure:
    label: Financial pressure
    short_description: Tax default, or lost rental income with a mortgage
    description: Tax default, or lost rental income with an open mortgage.
    when:
      any:
        - {signal: tax_default, within_days: 730}
        - all:
            - {signal: stro_license_removed, within_days: 365}
            - {owner: mortgage_open, is: true}
  quiet_inheritance:
    label: Quiet inheritance
    short_description: Recent transfer by death, trust or inheritance
    active: false
    note: requires ATTOM recorder data (Phase 6)
    when:
      signal: ownership_transfer
