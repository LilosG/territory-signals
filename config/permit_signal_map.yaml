# Permit APPROVAL_TYPE -> signal_group map (Phase 3 final, D4).
status: reviewed   # finalized in Phase 3 from the rules in the Phase 3 prompt; Mike may still adjust

# Exact APPROVAL_TYPE strings from pipelines/territory/sources/reports/permit_type_profile.csv
# (territory counts; some strings carry trailing spaces on purpose: they are the City's own values).
# Types not listed here are written as 'other' and reported in the match report.
# No approval TYPE names an ADU, so the adu group is filled by the Phase 3 re-derivation step
# (territory.permit_rederive): a permit with APPROVAL_ADU_TOTAL > 0 is grouped as adu.
# Changes from the proposed map: pipelines/territory/sources/reports/permit_map_changes.md

signal_groups: [pre_sale_prep, maintenance, remodel_addition, adu, demolition_lot_split, solar_energy, other]

# Discretionary land-use approvals. They stay 'other' below, but become remodel_addition when the
# record is residential (residential land-use parcel, or the record's own PROJECT_TYPE/APPROVAL_TYPE
# says residential). Non-residential records stay 'other'. Grading types are not included.
residential_remodel_types:
  - "Coastal Development Permit"
  - "Coastal Development"
  - "Emergency Coastal Dev Permit"
  - "Sensitive Coastal Resource"
  - "Site Development Permit"
  - "Site  Development Permit"
  - "Substantial Conformance Review"
  - "Conditional Use Permit"
  - "Neighborhood Use Permit"
  - "Limited Use Permit"
  - "Special Permit"
  - "Variance"
  - "Variance permit"
  - "Neighborhood Developmnt Permit"
  - "Neighborhood Development Permit"
  - "Planned Development Permit"
  - "Individual Historical Resource Nomination"
  - "Mills Act Agreement"
  - "Emergency Authorization-ESL"
  - "Emergency Authorization-Hist"
  - "La Jolla Shores Planned Dist."
  - "La Jolla Planned District"
  - "Hillside Review Overlay Zone"

# ---- Pre-sale prep refinement (Phase 5G, D14) -------------------------------------------------------------
# The 7 types mapped to pre_sale_prep below are electrical / plumbing / mechanical permits. Most of them are
# like-for-like systems work (furnace, water heater, AC, panel, repipe, sewer lateral, undergrounding), which
# is maintenance, not preparation to sell. So the TYPE only makes a permit a candidate; the DESCRIPTION decides.
# Text read (first non-blank): APPROVAL_SCOPE, JOB_BC_CODE_DESCRIPTION, then PROJECT_TITLE + PROJECT_SCOPE.
# Rules are case-insensitive regexes, applied in this order, first match wins:
#   1. non_residential, new_construction -> other   (tenant improvements, offices, gas stations, cell sites, new buildings)
#   2. solar           -> solar_energy      (a solar or battery install filed under an MEP type)
#   2b. adu_scope      -> adu               (v0.4.1: an MEP permit for an ADU, accessory dwelling, conversion into units,
#                                            or new attached/detached units is ADU work; same weight as other ADU permits)
#   3. cosmetic_scope  -> pre_sale_prep     (remodel, renovation, paint, flooring, landscaping/hardscape, facade,
#                                            addition, interior improvement)
#   4. weak_scope      -> pre_sale_prep     (kitchen, bath, windows/doors, roof, stucco, deck ...) unless a
#                                            systems_work word (repipe, drain, water heater, furnace ...) is present
#   5. everything else, including a blank description -> maintenance (weight 0)
presale_rules:
  non_residential:
    - '\btenant improvements?\b'
    - '\bT\.?I\.?\b'
    - '\b(commercial|office|retail|restaurant|cafe|café|shop|salon|gym|clinic|taproom|store|gas station|self[- ]storage|bank branch|dental|medical|vivarium|laborator(y|ies)|warehouse|hotel|church|school|lobby)\b'
    - '\bnon-?residential\b'
    - '\b(wireless|antennas?|WCF|spectrum act|cell (site|tower))\b'
  new_construction:
    - '\bnew (single|two|three|four|\d)[- ]?(story|stor(y|ies)|unit|family|dwelling)\b'
    - '\bnew (sdu|sfd|mdu|sfr)\b'
    - '\bnew construction\b'
  solar:
    - '\b(solar(?![- ](ready|rated))|photovoltaic|pvs?|modules?|roof[- ]?mount\w*|powerwalls?|batter(y|ies)|energy storage|ESS)\b'
    - '\bkw\b.{0,40}\b(dc|ac|inverter|modules?)\b'
  adu_scope:
    - '\b(j?adus?|accessory dwelling\w*|junior accessory\w*)\b'
    - '\bconver\w*\b.{0,60}\b(into|to)\b.{0,25}\bunits?\b'
    - '\bnew (attached|detached)\b.{0,40}\bunits?\b'
  cosmetic_scope:
    - '\b(remodel(s|ed|ing)?|re-?model|renovat\w*|rehab\w*|re-?stucco|paint(ing|ed)?|flooring|hardwood|hardscape|landscap\w*|fa[cç]ade|(?<!load )additions?|new floor plan)\b'
    - '\badd(ing)? (a )?(new )?(bed|bath)room\b'
    - '\b(garage[- ]conversion|convert\w* .{0,30}(garage|carport))\b'
    - '\binterior (improvements?|alterations?|upgrades?|work|finish\w*)\b'
    - '\bfloor (finish\w*|tiles?)\b'
  weak_scope:
    - '\b(kitchens?|bath(room)?s?|showers?|bathtub|tubs?|vanity|cabinet\w*|countertops?|backsplash|tile|tiling|windows?|doors?|roof(ing)?|re-?roof|stucco|siding|decks?|patio)\b'
  systems_work:
    - '\b(re-?pipe\w*|drains?|drainage|sewer|water heaters?|tankless|furnaces?|FAU|heat pumps?|air handlers?|duct(s|work|ing)?|mini-?splits?|a/?c|hvac|condenser|boiler|sub-?panel|panel|meter|service upgrade|amps?|overhead|underground\w*|oh to ug|gas (line|piping|meter)|water (line|service)|backflow|valve|compressor|thermostat|equipment|roof-?top|damage\w*)\b'

