# Permit APPROVAL_TYPE -> signal_group map (Phase 3 final, D4).
status: reviewed   # finalized in Phase 3 from the rules in the Phase 3 prompt; Mike may still adjust

# Exact APPROVAL_TYPE strings from pipelines/territory/sources/reports/permit_type_profile.csv
# (territory counts; some strings carry trailing spaces on purpose: they are the City's own values).
# Types not listed here are written as 'other' and reported in the match report.
# No approval TYPE names an ADU, so the adu group is filled by the Phase 3 re-derivation step
# (territory.permit_rederive): a permit with APPROVAL_ADU_TOTAL > 0 is grouped as adu.
# Changes from the proposed map: pipelines/territory/sources/reports/permit_map_changes.md

signal_groups: [pre_sale_prep, remodel_addition, adu, demolition_lot_split, solar_energy, other]

# Discretionary land-use approvals. They stay 'other' below, but become remodel_addition when the
# record is residential (residential land-use parcel, or the record's own PROJECT_TYPE/APPROVAL_TYPE
# says residential). Non-residential records stay 'other'. Grading types are not included.
residential_remodel_types:
  - "Coastal Development Permit"
  - "Coastal Development"
